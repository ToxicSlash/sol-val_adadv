pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.minecraftforge.net/" }
        gradlePluginPortal()
    }
}

include("common")
include("fabric")

// Some upstream distributions include a Forge module, but this source archive
// does not. Only include it when its project directory is actually present.
if (file("forge").isDirectory()) {
    include("forge")
}
