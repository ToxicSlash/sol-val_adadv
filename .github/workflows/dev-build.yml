name: Dev Fabric Build

on:
  push:
    branches: [ dev ]
    paths:
      - '.github/build-trigger'
  workflow_dispatch:

concurrency:
  group: dev-fabric-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Fabric 1.20.1
        run: gradle :fabric:build -PmcVer=1.20.1 --stacktrace
